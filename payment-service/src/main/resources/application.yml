spring:
  datasource:
    url: jdbc:postgresql://localhost:15432/payment_db?reWriteBatchedInserts=true
    username: user
    password: password
    driverClassName: org.postgresql.Driver
  jpa:
    open-in-view: false
    generate-ddl: false
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc.lob.non_contextual_creation: true
        jdbc:
          batch_size: 1000
          batch_versioned_data: true
          order_inserts: true
          order_updates: true
  flyway:
    enabled: true
    schemas: payment
    baseline-on-migrate: true
    validate-on-migrate: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    payment-processed-topic: payments.processed
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: payment-group

jwt:
  secret: ${JWT_PAYMENT_SECRET:mysecretkeymysecretkeymysecretkeymysecretkey}
  expiration: 86400000 # a day
  refresh-expiration: 604800000 # 7 days
