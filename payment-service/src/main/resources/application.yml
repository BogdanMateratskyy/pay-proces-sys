spring:
  datasource:
    url: jdbc:postgresql://localhost:15432/ea?reWriteBatchedInserts=true
    username: sa
    password: password
    driverClassName: org.postgresql.Driver
  jpa:
    open-in-view: false
    generate-ddl: false
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc.lob.non_contextual_creation: true
        jdbc:
          batch_size: 1000
          batch_versioned_data: true
          order_inserts: true
          order_updates: true
  kafka:
    bootstrap-servers: localhost:9092

jwt:
  secret: mysecretkeymysecretkeymysecretkeymysecretkey
  expiration: 86400000 # a day
  refresh-expiration: 604800000 # 7 days
