spring:
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: test-group
      payment-created-topic: tests.pay-created
      payment-processed-topic: tests.processed
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

app:
  bank-adapter-url: http://localhost:8083

jwt:
  secret: mysecretkeymysecretkeymysecretkeymysecretkey
  expiration: 86400000 # a day
  refresh-expiration: 604800000 # 7 days

resilience4j:
  retry:
    retryAspectOrder: 3
    instances:
      bankRetry:
        baseConfig: default
    configs:
      default:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - feign.FeignException.ServiceUnavailable
          - feign.FeignException.GatewayTimeout
          - java.io.IOException
  circuitbreaker:
    circuitBreakerAspectOrder: 4
    instances:
      bankCircuitBreaker:
        baseConfig: default
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
        recordExceptions:
          - feign.FeignException.ServiceUnavailable
          - feign.FeignException.GatewayTimeout
          - java.io.IOException
  bulkhead:
    instances:
      bankBulkhead:
        baseConfig: default
    configs:
      default:
        maxConcurrentCalls: 10
        maxWaitDuration: 0
  feign:
    client:
      config:
        default:
          connectTimeout: 2000
          readTimeout: 5000
        bank-adapter-service:
          connectTimeout: 1000
          readTimeout: 2000
