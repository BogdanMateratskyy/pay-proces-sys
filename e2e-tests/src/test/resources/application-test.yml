jwt:
  secret: ${JWT_PAYMENT_SECRET:mysecretkeymysecretkeymysecretkeymysecretkey}
  expiration: 3600000
  refresh-expiration: 604800000
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb;INIT=CREATE SCHEMA IF NOT EXISTS payment;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    driverClassName: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:user}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
  jpa:
    generate-ddl: true
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: payment
    baseline-on-migrate: true
    validate-on-migrate: true
    fail-on-missing-locations: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9093}
    payment-processed-topic: payments-test.processed
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: payment-test-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
